name: iOS build (online)

# Spec 025 — merge CI for iOS build specifications + mockable unit tests.
# Does NOT require a provisioned on-device Foundation Models runtime.
# Device/eval work lives in ios-device-eval.yml (non-required).

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ios-build-online:
    name: iOS build (online)
    # GitHub-hosted macOS with Xcode 27 (runner-images#14404; preview label).
    # The app cannot compile on the Xcode 26.x images: the intelligence layer
    # uses iOS 27 FoundationModels APIs. Until 2026-09-23 this job targeted a
    # self-hosted Mac that was never re-registered, so it queued forever and no
    # build or test ran. Hosted macOS minutes are free for this public repo.
    # Override with the IOS_RUNNER repo variable (e.g. a macos-27 GA label).
    runs-on: ${{ vars.IOS_RUNNER || 'xcode-27' }}
    timeout-minutes: 90
    env:
      CI_ONLINE: "1"
      # On the xcode-27 image /Applications/Xcode.app is Xcode 27.
      # Override IOS_DEVELOPER_DIR / IOS_SIM_DESTINATION as repo variables.
      DEVELOPER_DIR: ${{ vars.IOS_DEVELOPER_DIR || '/Applications/Xcode.app/Contents/Developer' }}
      IOS_SIM_DESTINATION: ${{ vars.IOS_SIM_DESTINATION || 'platform=iOS Simulator,name=iPhone 17,OS=latest' }}
    steps:
      - uses: actions/checkout@v6

      # Model weights are Git LFS (spec 030 R3). Without them the build receives
      # pointer files and fails at RUNTIME as a model-load error. ~148 MB per
      # fetch would exhaust the free LFS bandwidth quota in a handful of runs, so
      # the objects are cached, keyed on the LFS object ids.
      - name: List LFS objects
        run: git lfs ls-files --long | cut -d ' ' -f1 | sort > .lfs-assets-id

      - name: Restore LFS cache
        uses: actions/cache@v6
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}

      - name: Fetch LFS objects
        run: |
          git lfs pull
          # Fail here, not at runtime: a pointer file is ~130 bytes of text.
          if git lfs ls-files | grep -q ' - '; then
            echo "FAIL: some LFS objects are still pointer files:"
            git lfs ls-files | grep ' - '
            exit 1
          fi

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun simctl list runtimes | grep -i ios || true

      - name: Assert iOS build specifications
        run: bash scripts/ci/assert_ios_build_specs.sh

      - name: Install SwiftLint
        run: brew install swiftlint

      # spec-006/025: SwiftLint blocking for new violations on PRs (changed files
      # only). The no_print custom rule (spec-005) is enforced here.
      - name: SwiftLint changed files (strict, blocking)
        if: github.event_name == 'pull_request'
        run: bash scripts/ci/lint_changed_swift.sh "${{ github.base_ref }}"

      - name: SwiftLint full project (advisory on push)
        if: github.event_name == 'push'
        continue-on-error: true
        run: swiftlint lint --strict

      # No secrets/config stubs needed: on-device only (no backend).
      - name: Build and test (online suite)
        run: |
          set -euo pipefail

          run_tests() {
            rm -rf TestResults
            rm -rf TestResults.xcresult
            xcodebuild \
              -scheme withMemento \
              -destination "$IOS_SIM_DESTINATION" \
              -resultBundlePath TestResults \
              -enableCodeCoverage YES \
              -parallel-testing-enabled NO \
              -skip-testing:withMementoUITests \
              test
          }

          if ! run_tests; then
            echo "First simulator test run failed. Resetting simulators and retrying once..."
            xcrun simctl shutdown all || true
            xcrun simctl erase all || true
            run_tests
          fi

      - name: Coverage gate (online suite)
        env:
          # spec-006/011/025: RATCHET-ONLY. Floor may only ever INCREASE.
          # Measured over the online suite (CI_ONLINE=1 skips live FM generation).
          # Baseline 13% retained from the prior gate; re-measure upward after
          # suite composition stabilizes — never lower it.
          MIN_COVERAGE: "13"
        run: bash scripts/ci/check_coverage.sh TestResults.xcresult

      - name: Release build for size measurement
        # The size that matters is the Release product's, and resources (the
        # ~147 MB of Core ML voice weights bundled per DEC-012) dominate it.
        # Cheap relative to the test build above, which is already warm.
        run: |
          set -euo pipefail
          xcodebuild \
            -scheme withMemento \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .build-size \
            build

      - name: App size gate (docs/app-store/00 C10)
        # Nothing measured app size until 2026-09-12. The ceiling is the 200 MB
        # cellular-download threshold, not Apple's 4 GB limit: above 200 MB iOS
        # prompts before downloading over cellular, which is a conversion tax on
        # every install. Headroom is currently ~12 MB, so one more voice pack
        # crosses it — which is exactly why this is a gate and not a note.
        run: |
          bash scripts/ci/check_app_size.sh \
            .build-size/Build/Products/Release-iphonesimulator/withMemento.app

      - name: Install Periphery
        # Not `brew install peripheryapp/periphery/periphery`. That tap's cask
        # carries `depends_on macos: :catalina`, which current Homebrew has
        # removed outright, so the install dies before the scan runs — and the
        # tap is third-party, so we cannot fix it and cannot rely on it being
        # fixed. Pinning the release also makes the job reproducible: a floating
        # `brew install` silently changes the analyser version under us, and a
        # dead-code gate that changes its mind between runs is worse than none.
        env:
          PERIPHERY_VERSION: 3.8.0
          PERIPHERY_SHA256: 07d4e286e31dd79164df39097e0b59f533c94badbe18158464a455ea88a166d7
        run: |
          set -euo pipefail
          # Staged in RUNNER_TEMP, not the checkout: the dead-code scan walks
          # the workspace, and the archive-hygiene gate counts what is in it.
          zip="$RUNNER_TEMP/periphery.zip"
          curl -fsSL -o "$zip" \
            "https://github.com/peripheryapp/periphery/releases/download/${PERIPHERY_VERSION}/periphery-${PERIPHERY_VERSION}.zip"
          echo "${PERIPHERY_SHA256}  $zip" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/periphery"
          # `libIndexStore.dylib` ships beside the binary and is loaded from the
          # same directory, so both are extracted together and the directory
          # goes on PATH rather than the binary being copied out alone.
          unzip -q -o "$zip" -d "$RUNNER_TEMP/periphery"
          chmod +x "$RUNNER_TEMP/periphery/periphery"
          echo "$RUNNER_TEMP/periphery" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/periphery/periphery" version

      - name: Periphery dead-code scan (advisory)
        # Advisory in that findings do not fail the build; the regression gate
        # below decides. But the exit status is recorded, because a scan that
        # crashed still leaves an empty `periphery-report.txt` behind, and an
        # empty report grepped for new findings reports success. A check that
        # cannot run must not read as a pass (046 R1, the whole reason this
        # repo has a scorer-fixture rule).
        continue-on-error: true
        run: |
          set +e
          periphery scan \
            --project withMemento.xcodeproj \
            --schemes withMemento \
            --format xcode \
            --retain-public \
            > periphery-report.txt
          echo $? > periphery-exit.txt
          echo "periphery exit: $(cat periphery-exit.txt)"

      - name: Periphery regression gate (new issues only)
        if: github.event_name == 'pull_request'
        run: bash scripts/ci/check_periphery_regression.sh periphery-report.txt "${{ github.base_ref }}"

      - name: Upload Periphery report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: periphery-report
          if-no-files-found: ignore
          path: |
            periphery-report.txt
            periphery-exit.txt
