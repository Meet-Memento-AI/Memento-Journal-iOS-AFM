name: iOS quality and chat helper tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios-unit-ui:
    name: iOS quality gates
    runs-on: [self-hosted, macOS, ARM64, ios, xcode]
    env:
      # The on-device Intelligence layer requires the Foundation Models SDK
      # (Xcode 26+/iOS 26+). Pin the toolchain for reproducibility; a runner
      # with Xcode installed elsewhere can override IOS_DEVELOPER_DIR /
      # IOS_SIM_DESTINATION as repo variables.
      DEVELOPER_DIR: ${{ vars.IOS_DEVELOPER_DIR || '/Applications/Xcode.app/Contents/Developer' }}
      # OS=latest resolves to whatever iOS runtime the runner has (26 or 27 both
      # carry the Foundation Models SDK); override IOS_SIM_DESTINATION to pin an
      # exact runtime on a runner that has several.
      IOS_SIM_DESTINATION: ${{ vars.IOS_SIM_DESTINATION || 'platform=iOS Simulator,name=iPhone 17,OS=latest' }}
    steps:
      - uses: actions/checkout@v6

      - name: Show pinned toolchain
        run: |
          echo "DEVELOPER_DIR=$DEVELOPER_DIR"
          xcodebuild -version
          echo "Destination: $IOS_SIM_DESTINATION"

      - name: Install SwiftLint
        run: brew install swiftlint

      # spec-006: SwiftLint is now BLOCKING for new violations on PRs (changed files
      # only, so pre-existing debt elsewhere doesn't block). The no_print custom rule
      # (spec-005) is enforced here.
      - name: SwiftLint changed files (strict, blocking)
        if: github.event_name == 'pull_request'
        run: bash scripts/ci/lint_changed_swift.sh "${{ github.base_ref }}"

      - name: SwiftLint full project (advisory on push)
        if: github.event_name == 'push'
        continue-on-error: true
        run: swiftlint lint --strict

      # No secrets/config stubs needed: the app is on-device only (no backend),
      # so it builds and tests with no API keys or xcconfig setup.

      - name: Build and test (simulator)
        run: |
          set -euo pipefail

          run_tests() {
            rm -rf TestResults
            rm -rf TestResults.xcresult
            xcodebuild \
              -scheme MeetMemento \
              -destination "$IOS_SIM_DESTINATION" \
              -resultBundlePath TestResults \
              -enableCodeCoverage YES \
              -parallel-testing-enabled NO \
              -skip-testing:MeetMementoUITests \
              test
          }

          if ! run_tests; then
            echo "First simulator test run failed. Resetting simulators and retrying once..."
            xcrun simctl shutdown all || true
            xcrun simctl erase all || true
            run_tests
          fi

      - name: Coverage gate
        env:
          # spec-006/011: RATCHET-ONLY. This floor may only ever INCREASE.
          # Baseline covers the spec-011 security paths (Encryption/Security/
          # Auth/Journal) plus the on-device Intelligence suites (TurnClassifier,
          # RetrievalPolicy, EntryRetriever confidence, conversation flow, prompt
          # stance/personalization). Measured global line coverage after the
          # Intelligence suites landed: 13.31% (Xcode 26, iPhone 17). Floor set a
          # hair below so normal fluctuation doesn't flake CI; raise as coverage
          # grows — never lower it.
          MIN_COVERAGE: "13"
        run: bash scripts/ci/check_coverage.sh TestResults.xcresult

      - name: Install Periphery
        run: brew install peripheryapp/periphery/periphery

      - name: Periphery dead-code scan (advisory)
        continue-on-error: true
        run: |
          periphery scan \
            --project MeetMemento.xcodeproj \
            --schemes MeetMemento \
            --format xcode \
            --retain-public \
            > periphery-report.txt

      - name: Periphery regression gate (new issues only)
        if: github.event_name == 'pull_request'
        run: bash scripts/ci/check_periphery_regression.sh periphery-report.txt "${{ github.base_ref }}"

      - name: Upload Periphery report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: periphery-report
          path: periphery-report.txt
