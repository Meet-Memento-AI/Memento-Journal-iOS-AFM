name: iOS quality and chat helper tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios-unit-ui:
    name: iOS quality gates
    runs-on: [self-hosted, macOS, ARM64, ios, xcode]
    steps:
      - uses: actions/checkout@v6

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: SwiftLint changed files (strict)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: bash scripts/ci/lint_changed_swift.sh "${{ github.base_ref }}"

      - name: SwiftLint advisory note
        if: github.event_name == 'pull_request'
        run: echo "SwiftLint is advisory during rollout. Keep iOS build, tests, coverage, and security checks as blocking gates."

      - name: SwiftLint full project (advisory on push)
        if: github.event_name == 'push'
        continue-on-error: true
        run: swiftlint lint --strict

      - name: Create CI Secrets.swift
        run: |
          cat > MeetMemento/Secrets.swift << 'EOF'
          import Foundation

          enum Secrets {
              static let supabaseUrl = ProcessInfo.processInfo.environment["SUPABASE_URL"] ?? "https://example.supabase.co"
              static let supabaseAnonKey = ProcessInfo.processInfo.environment["SUPABASE_ANON_KEY"] ?? "public-anon-key-placeholder"
          }
          EOF

      - name: Build and test (simulator)
        run: |
          set -euo pipefail

          run_tests() {
            xcodebuild \
              -scheme MeetMemento \
              -destination "platform=iOS Simulator,name=iPhone 17" \
              -resultBundlePath TestResults \
              -enableCodeCoverage YES \
              -parallel-testing-enabled NO \
              test
          }

          if ! run_tests; then
            echo "First simulator test run failed. Resetting simulators and retrying once..."
            xcrun simctl shutdown all || true
            xcrun simctl erase all || true
            run_tests
          fi

      - name: Coverage gate
        env:
          MIN_COVERAGE: "5"
        run: bash scripts/ci/check_coverage.sh TestResults.xcresult

      - name: Install Periphery
        run: brew install peripheryapp/periphery/periphery

      - name: Periphery dead-code scan (advisory)
        continue-on-error: true
        run: |
          periphery scan \
            --project MeetMemento.xcodeproj \
            --schemes MeetMemento \
            --format xcode \
            --retain-public \
            > periphery-report.txt

      - name: Periphery regression gate (new issues only)
        if: github.event_name == 'pull_request'
        run: bash scripts/ci/check_periphery_regression.sh periphery-report.txt "${{ github.base_ref }}"

      - name: Upload Periphery report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: periphery-report
          path: periphery-report.txt

  deno-chat-lib:
    name: Deno chat tests
    runs-on: [self-hosted, Linux, x64]
    steps:
      - uses: actions/checkout@v6

      - name: Ensure unzip is available
        run: |
          set -euo pipefail
          if command -v unzip >/dev/null 2>&1; then
            exit 0
          fi

          if command -v apt-get >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y unzip
          elif command -v dnf >/dev/null 2>&1; then
            sudo dnf install -y unzip
          elif command -v yum >/dev/null 2>&1; then
            sudo yum install -y unzip
          elif command -v brew >/dev/null 2>&1; then
            brew install unzip
          else
            echo "unzip is required but no supported package manager was found."
            exit 1
          fi

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Deno test (chat lib)
        working-directory: supabase/functions/chat
        run: deno test --allow-read --allow-net lib_test.ts
