name: Security gates

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
  schedule:
    - cron: "28 4 * * 1"

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  sonar:
    name: Sonar analysis
    runs-on: [self-hosted, macOS, ARM64, ios, xcode]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate Sonar configuration
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
        run: |
          if [ -z "$SONAR_TOKEN" ] || [ -z "$SONAR_PROJECT_KEY" ]; then
            echo "Missing Sonar configuration. Required: secret SONAR_TOKEN and variable SONAR_PROJECT_KEY."
            exit 1
          fi

      - name: Sonar scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        with:
          args: >-
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Dependency review
        continue-on-error: true
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

      - name: Dependency review note
        if: always()
        run: echo "Dependency review is currently advisory. Enable dependency graph + branch protection required checks to enforce blocking."

  secret-scan:
    name: Secret scanning
    runs-on: [self-hosted, macOS, ARM64, ios, xcode]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          if ! command -v gitleaks >/dev/null 2>&1; then
            brew install gitleaks
          fi

      - name: Secret scan on new commits only
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "$BASE_REF" --depth=1
            LOG_OPTS="origin/$BASE_REF..HEAD"
          else
            LOG_OPTS="-n 1"
          fi

          echo "Running gitleaks with log options: $LOG_OPTS"
          gitleaks git . --redact --log-opts="$LOG_OPTS" --exit-code 1
