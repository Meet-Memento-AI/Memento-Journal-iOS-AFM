name: Security gates

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
  schedule:
    - cron: "28 4 * * 1"

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  sonar:
    name: Sonar analysis
    runs-on: [self-hosted, Linux, x64]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate Sonar configuration
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
        run: |
          if [ -z "$SONAR_TOKEN" ] || [ -z "$SONAR_PROJECT_KEY" ]; then
            echo "Missing Sonar configuration. Required: secret SONAR_TOKEN and variable SONAR_PROJECT_KEY."
            exit 1
          fi

      - name: Sonar scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
        run: |
          "$HOME/.local/sonar-scanner/bin/sonar-scanner" \
            -Dsonar.projectKey="$SONAR_PROJECT_KEY" \
            -Dsonar.host.url="$SONAR_HOST_URL" \
            -Dsonar.token="$SONAR_TOKEN" \
            -Dsonar.sources=.

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: [self-hosted, Linux, x64]
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # spec-006/025: blocking on critical vulnerabilities (online merge lane).
      - name: Dependency review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: critical

  secret-scan:
    name: Secret scanning
    runs-on: [self-hosted, Linux, x64]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          if ! command -v gitleaks >/dev/null 2>&1; then
            mkdir -p "$HOME/.local/bin"
            curl -sSfL https://raw.githubusercontent.com/gitleaks/gitleaks/master/install.sh | bash -s -- -b "$HOME/.local/bin" v8.24.2
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          fi

      - name: Secret scan on new commits only
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "$BASE_REF" --depth=1
            LOG_OPTS="origin/$BASE_REF..HEAD"
          else
            LOG_OPTS="-n 1"
          fi

          echo "Running gitleaks with log options: $LOG_OPTS"
          "$HOME/.local/bin/gitleaks" git . --redact --log-opts="$LOG_OPTS" --exit-code 1
