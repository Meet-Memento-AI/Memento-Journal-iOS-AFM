name: Deploy to dev and staging

on:
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      target:
        description: Deployment target
        required: true
        type: choice
        default: staging
        options:
          - dev
          - staging
      confirm_staging:
        description: Type deploy-staging to confirm a staging deployment
        required: false
        type: string

concurrency:
  group: deploy-dev-staging-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    name: Preflight deploy checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify function directories exist
        run: |
          count=$(find supabase/functions -mindepth 1 -maxdepth 1 -type d ! -name "_shared" | wc -l | tr -d ' ')
          if [ "$count" -eq 0 ]; then
            echo "No deployable edge functions found."
            exit 1
          fi
          echo "Found $count deployable edge functions."

      - name: Verify migration directories exist
        run: |
          if [ ! -d "supabase/migrations" ] && [ ! -d "supabase_migrations" ]; then
            echo "No migration directory found."
            exit 1
          fi

  deploy-dev:
    name: Deploy dev
    runs-on: ubuntu-latest
    needs: preflight
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.target == 'dev')
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: latest

      - name: Require dev deployment secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.DEV_SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.DEV_SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "Missing required dev deployment secrets."
            echo "Required: DEV_SUPABASE_ACCESS_TOKEN, DEV_SUPABASE_PROJECT_REF"
            exit 1
          fi

      - name: Link Supabase project (dev)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.DEV_SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.DEV_SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "Missing required dev environment secrets."
            echo "Required: DEV_SUPABASE_ACCESS_TOKEN, DEV_SUPABASE_PROJECT_REF"
            exit 1
          fi
          supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Apply migrations (dev)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.DEV_SUPABASE_ACCESS_TOKEN }}
        run: supabase db push

      - name: Deploy edge functions (dev)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.DEV_SUPABASE_ACCESS_TOKEN }}
        run: |
          for dir in supabase/functions/*; do
            if [ -d "$dir" ]; then
              fn=$(basename "$dir")
              if [ "$fn" = "_shared" ]; then
                continue
              fi
              echo "Deploying $fn"
              supabase functions deploy "$fn"
            fi
          done

      - name: Smoke check (dev)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.DEV_SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions list > dev-functions.txt
          for dir in supabase/functions/*; do
            if [ -d "$dir" ]; then
              fn=$(basename "$dir")
              if [ "$fn" = "_shared" ]; then
                continue
              fi
              grep -q "$fn" dev-functions.txt || {
                echo "Smoke check failed: expected function '$fn' not listed in dev."
                exit 1
              }
            fi
          done

  deploy-staging:
    name: Deploy staging
    runs-on: ubuntu-latest
    needs: preflight
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'staging'
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: latest

      - name: Require staging deployment secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "Missing required staging deployment secrets."
            echo "Required: STAGING_SUPABASE_ACCESS_TOKEN, STAGING_SUPABASE_PROJECT_REF"
            exit 1
          fi

      - name: Require explicit staging confirmation
        run: |
          if [ "${{ inputs.confirm_staging }}" != "deploy-staging" ]; then
            echo "Staging deployment requires workflow_dispatch with confirm_staging=deploy-staging."
            exit 1
          fi

      - name: Link Supabase project (staging)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "Missing required staging environment secrets."
            echo "Required: STAGING_SUPABASE_ACCESS_TOKEN, STAGING_SUPABASE_PROJECT_REF"
            exit 1
          fi
          supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Apply migrations (staging)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
        run: supabase db push

      - name: Deploy edge functions (staging)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
        run: |
          for dir in supabase/functions/*; do
            if [ -d "$dir" ]; then
              fn=$(basename "$dir")
              if [ "$fn" = "_shared" ]; then
                continue
              fi
              echo "Deploying $fn"
              supabase functions deploy "$fn"
            fi
          done

      - name: Smoke check (staging)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions list > staging-functions.txt
          for dir in supabase/functions/*; do
            if [ -d "$dir" ]; then
              fn=$(basename "$dir")
              if [ "$fn" = "_shared" ]; then
                continue
              fi
              grep -q "$fn" staging-functions.txt || {
                echo "Smoke check failed: expected function '$fn' not listed in staging."
                exit 1
              }
            fi
          done
