name: Deploy to dev and staging

on:
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      target:
        description: Deployment target
        required: true
        type: choice
        default: staging
        options:
          - dev
          - staging
      confirm_staging:
        description: Type deploy-staging to confirm a staging deployment
        required: false
        type: string

concurrency:
  group: deploy-dev-staging-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    name: Preflight deploy checks
    runs-on: [self-hosted, Linux, x64]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify function directories exist
        run: |
          count=$(find supabase/functions -mindepth 1 -maxdepth 1 -type d ! -name "_shared" | wc -l | tr -d ' ')
          if [ "$count" -eq 0 ]; then
            echo "No deployable edge functions found."
            exit 1
          fi
          echo "Found $count deployable edge functions."

      - name: Verify migration directories exist
        run: |
          if [ ! -d "supabase/migrations" ] && [ ! -d "supabase_migrations" ]; then
            echo "No migration directory found."
            exit 1
          fi

  deploy-dev:
    name: Deploy dev
    runs-on: [self-hosted, Linux, x64]
    needs: preflight
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.target == 'dev')
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Apply pending migrations to self-hosted dev DB
        env:
          DB_CONTAINER: ${{ vars.DEV_SUPABASE_DB_CONTAINER }}
        run: |
          set -euo pipefail

          DB_CONTAINER="${DB_CONTAINER:-supabase-db}"

          if ! docker ps --format '{{.Names}}' | grep -Fxq "$DB_CONTAINER"; then
            echo "Database container '$DB_CONTAINER' is not running."
            exit 1
          fi

          docker exec "$DB_CONTAINER" psql -U supabase_admin -d postgres -v ON_ERROR_STOP=1 -c "
          create schema if not exists meta;
          create table if not exists meta.ci_migrations (
            migration_id text primary key,
            applied_at timestamptz not null default now()
          );"

          mapfile -t migration_files < <(
            {
              find supabase/migrations -maxdepth 1 -type f -name '*.sql' 2>/dev/null;
              find supabase_migrations -maxdepth 1 -type f -name '*.sql' 2>/dev/null;
            } | sort
          )

          if [ "${#migration_files[@]}" -eq 0 ]; then
            echo "No migration files found."
            exit 1
          fi

          for file in "${migration_files[@]}"; do
            migration_id=$(printf "%s" "$file" | sed "s/'/''/g")
            already_applied=$(docker exec "$DB_CONTAINER" psql -U supabase_admin -d postgres -Atqc "select 1 from meta.ci_migrations where migration_id='${migration_id}' limit 1;")

            if [ "$already_applied" = "1" ]; then
              echo "Skipping already applied migration: $file"
              continue
            fi

            echo "Applying migration: $file"
            if ! docker exec -i "$DB_CONTAINER" psql -U supabase_admin -d postgres -v ON_ERROR_STOP=1 < "$file" 2>/tmp/migration.err; then
              if grep -Eq "already exists|duplicate key value" /tmp/migration.err; then
                echo "Migration has already-applied objects; recording as applied and continuing: $file"
              else
                cat /tmp/migration.err
                exit 1
              fi
            fi
            docker exec "$DB_CONTAINER" psql -U supabase_admin -d postgres -v ON_ERROR_STOP=1 -c "insert into meta.ci_migrations (migration_id) values ('${migration_id}');"
          done

      - name: Sync edge functions to self-hosted dev runtime
        env:
          EDGE_CONTAINER: ${{ vars.DEV_SUPABASE_EDGE_CONTAINER }}
          FUNCTIONS_PATH: ${{ vars.DEV_SUPABASE_FUNCTIONS_PATH }}
        run: |
          set -euo pipefail

          EDGE_CONTAINER="${EDGE_CONTAINER:-supabase-edge-functions}"
          FUNCTIONS_PATH="${FUNCTIONS_PATH:-/home/thomas/supabase/docker/volumes/functions}"

          mkdir -p "$FUNCTIONS_PATH"
          if command -v rsync >/dev/null 2>&1; then
            rsync -a --delete --exclude '.DS_Store' --exclude 'README.md' supabase/functions/ "$FUNCTIONS_PATH/"
          else
            find "$FUNCTIONS_PATH" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
            cp -R supabase/functions/. "$FUNCTIONS_PATH/"
            rm -f "$FUNCTIONS_PATH/.DS_Store" "$FUNCTIONS_PATH/README.md"
          fi
          docker restart "$EDGE_CONTAINER"

      - name: Smoke check (dev)
        env:
          EDGE_CONTAINER: ${{ vars.DEV_SUPABASE_EDGE_CONTAINER }}
          FUNCTIONS_PATH: ${{ vars.DEV_SUPABASE_FUNCTIONS_PATH }}
        run: |
          set -euo pipefail

          EDGE_CONTAINER="${EDGE_CONTAINER:-supabase-edge-functions}"
          FUNCTIONS_PATH="${FUNCTIONS_PATH:-/home/thomas/supabase/docker/volumes/functions}"

          docker ps --format '{{.Names}}' | grep -Fxq "$EDGE_CONTAINER" || {
            echo "Edge runtime container '$EDGE_CONTAINER' is not running."
            exit 1
          }

          for dir in supabase/functions/*; do
            if [ -d "$dir" ]; then
              fn=$(basename "$dir")
              if [ "$fn" = "_shared" ] || [ ! -f "$dir/index.ts" ]; then
                continue
              fi
              if [ ! -f "$FUNCTIONS_PATH/$fn/index.ts" ]; then
                echo "Smoke check failed: expected function '$fn' was not synced to '$FUNCTIONS_PATH'."
                exit 1
              fi
            fi
          done

  deploy-staging:
    name: Deploy staging
    runs-on: [self-hosted, Linux, x64]
    needs: preflight
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'staging'
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Require explicit staging confirmation
        run: |
          if [ "${{ inputs.confirm_staging }}" != "deploy-staging" ]; then
            echo "Staging deployment requires workflow_dispatch with confirm_staging=deploy-staging."
            exit 1
          fi

      - name: Apply pending migrations to self-hosted staging DB
        env:
          DB_CONTAINER: ${{ vars.STAGING_SUPABASE_DB_CONTAINER }}
        run: |
          set -euo pipefail

          DB_CONTAINER="${DB_CONTAINER:-supabase-db}"

          if ! docker ps --format '{{.Names}}' | grep -Fxq "$DB_CONTAINER"; then
            echo "Database container '$DB_CONTAINER' is not running."
            exit 1
          fi

          docker exec "$DB_CONTAINER" psql -U supabase_admin -d postgres -v ON_ERROR_STOP=1 -c "
          create schema if not exists meta;
          create table if not exists meta.ci_migrations (
            migration_id text primary key,
            applied_at timestamptz not null default now()
          );"

          mapfile -t migration_files < <(
            {
              find supabase/migrations -maxdepth 1 -type f -name '*.sql' 2>/dev/null;
              find supabase_migrations -maxdepth 1 -type f -name '*.sql' 2>/dev/null;
            } | sort
          )

          if [ "${#migration_files[@]}" -eq 0 ]; then
            echo "No migration files found."
            exit 1
          fi

          for file in "${migration_files[@]}"; do
            migration_id=$(printf "%s" "$file" | sed "s/'/''/g")
            already_applied=$(docker exec "$DB_CONTAINER" psql -U supabase_admin -d postgres -Atqc "select 1 from meta.ci_migrations where migration_id='${migration_id}' limit 1;")

            if [ "$already_applied" = "1" ]; then
              echo "Skipping already applied migration: $file"
              continue
            fi

            echo "Applying migration: $file"
            if ! docker exec -i "$DB_CONTAINER" psql -U supabase_admin -d postgres -v ON_ERROR_STOP=1 < "$file" 2>/tmp/migration.err; then
              if grep -Eq "already exists|duplicate key value" /tmp/migration.err; then
                echo "Migration has already-applied objects; recording as applied and continuing: $file"
              else
                cat /tmp/migration.err
                exit 1
              fi
            fi
            docker exec "$DB_CONTAINER" psql -U supabase_admin -d postgres -v ON_ERROR_STOP=1 -c "insert into meta.ci_migrations (migration_id) values ('${migration_id}');"
          done

      - name: Sync edge functions to self-hosted staging runtime
        env:
          EDGE_CONTAINER: ${{ vars.STAGING_SUPABASE_EDGE_CONTAINER }}
          FUNCTIONS_PATH: ${{ vars.STAGING_SUPABASE_FUNCTIONS_PATH }}
        run: |
          set -euo pipefail

          EDGE_CONTAINER="${EDGE_CONTAINER:-supabase-edge-functions}"
          FUNCTIONS_PATH="${FUNCTIONS_PATH:-/home/thomas/supabase/docker/volumes/functions}"

          mkdir -p "$FUNCTIONS_PATH"
          if command -v rsync >/dev/null 2>&1; then
            rsync -a --delete --exclude '.DS_Store' --exclude 'README.md' supabase/functions/ "$FUNCTIONS_PATH/"
          else
            find "$FUNCTIONS_PATH" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
            cp -R supabase/functions/. "$FUNCTIONS_PATH/"
            rm -f "$FUNCTIONS_PATH/.DS_Store" "$FUNCTIONS_PATH/README.md"
          fi
          docker restart "$EDGE_CONTAINER"

      - name: Smoke check (staging)
        env:
          EDGE_CONTAINER: ${{ vars.STAGING_SUPABASE_EDGE_CONTAINER }}
          FUNCTIONS_PATH: ${{ vars.STAGING_SUPABASE_FUNCTIONS_PATH }}
        run: |
          set -euo pipefail

          EDGE_CONTAINER="${EDGE_CONTAINER:-supabase-edge-functions}"
          FUNCTIONS_PATH="${FUNCTIONS_PATH:-/home/thomas/supabase/docker/volumes/functions}"

          docker ps --format '{{.Names}}' | grep -Fxq "$EDGE_CONTAINER" || {
            echo "Edge runtime container '$EDGE_CONTAINER' is not running."
            exit 1
          }

          for dir in supabase/functions/*; do
            if [ -d "$dir" ]; then
              fn=$(basename "$dir")
              if [ "$fn" = "_shared" ] || [ ! -f "$dir/index.ts" ]; then
                continue
              fi
              if [ ! -f "$FUNCTIONS_PATH/$fn/index.ts" ]; then
                echo "Smoke check failed: expected function '$fn' was not synced to '$FUNCTIONS_PATH'."
                exit 1
              fi
            fi
          done
