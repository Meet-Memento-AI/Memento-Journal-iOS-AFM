name: Deploy to production

on:
  workflow_dispatch:
    inputs:
      confirm_production:
        description: Type deploy-production to confirm a production deployment
        required: true
        type: string

concurrency:
  group: deploy-production-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  checks: read

jobs:
  preflight:
    name: Preflight production checks
    runs-on: [self-hosted, Linux, x64]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify function directories exist
        run: |
          count=$(find supabase/functions -mindepth 1 -maxdepth 1 -type d ! -name "_shared" | wc -l | tr -d ' ')
          if [ "$count" -eq 0 ]; then
            echo "No deployable edge functions found."
            exit 1
          fi
          echo "Found $count deployable edge functions."

      - name: Verify migration directories exist
        run: |
          if [ ! -d "supabase/migrations" ] && [ ! -d "supabase_migrations" ]; then
            echo "No migration directory found."
            exit 1
          fi

  # Test gate (spec 006): production never deploys a SHA whose tests are not green.
  tests:
    name: Test gate
    runs-on: [self-hosted, Linux, x64]
    needs: preflight
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Deno test (chat lib)
        working-directory: supabase/functions/chat
        run: deno test --allow-read --allow-net lib_test.ts

      - name: Deno test (shared rate limit + auth)
        working-directory: supabase/functions
        run: deno test --no-check --allow-net --allow-env _shared/rate_limit_test.ts _shared/auth_test.ts

      - name: Require the iOS test workflow to have passed for this SHA
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.sha;
            const { data } = await github.rest.checks.listForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: sha,
              per_page: 100,
            });
            // The iOS test job is named "iOS unit + UI tests" (see ios-tests.yml).
            const iosChecks = data.check_runs.filter(c =>
              /iOS|ios-unit-ui|SwiftLint|coverage/i.test(c.name));
            if (iosChecks.length === 0) {
              core.setFailed(`No iOS test check runs found for ${sha}. Push to main/dev and let ios-tests.yml run before deploying.`);
              return;
            }
            const failed = iosChecks.filter(c => c.conclusion !== 'success' && c.conclusion !== 'skipped');
            if (failed.length > 0) {
              core.setFailed(`iOS checks not green for ${sha}: ` +
                failed.map(c => `${c.name}=${c.conclusion}`).join(', '));
              return;
            }
            core.info(`iOS checks green for ${sha}: ${iosChecks.map(c => c.name).join(', ')}`);

  deploy-prod:
    name: Deploy production
    runs-on: [self-hosted, Linux, x64]
    needs: [preflight, tests]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Require explicit production confirmation
        run: |
          if [ "${{ inputs.confirm_production }}" != "deploy-production" ]; then
            echo "Production deployment requires workflow_dispatch with confirm_production=deploy-production."
            exit 1
          fi

      - name: Install Supabase CLI
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -fsSL https://github.com/supabase/cli/releases/latest/download/supabase_linux_amd64.tar.gz -o /tmp/supabase_cli.tar.gz
          tar -xzf /tmp/supabase_cli.tar.gz -C "$HOME/.local/bin" supabase
          chmod +x "$HOME/.local/bin/supabase"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/supabase" --version

      - name: Require production deploy secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.PROD_SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.PROD_SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "Missing required production deployment secrets."
            echo "Required: PROD_SUPABASE_ACCESS_TOKEN, PROD_SUPABASE_PROJECT_REF"
            exit 1
          fi

      - name: Link production project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.PROD_SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.PROD_SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Apply migrations to production
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.PROD_SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          supabase db push --include-all

      - name: Deploy edge functions to production
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.PROD_SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          for dir in supabase/functions/*; do
            if [ -d "$dir" ]; then
              fn=$(basename "$dir")
              if [ "$fn" = "_shared" ] || [ ! -f "$dir/index.ts" ]; then
                continue
              fi
              echo "Deploying $fn"
              supabase functions deploy "$fn"
            fi
          done

      - name: Smoke check production functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.PROD_SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          supabase functions list > prod-functions.txt
          for dir in supabase/functions/*; do
            if [ -d "$dir" ]; then
              fn=$(basename "$dir")
              if [ "$fn" = "_shared" ] || [ ! -f "$dir/index.ts" ]; then
                continue
              fi
              grep -q "$fn" prod-functions.txt || {
                echo "Smoke check failed: expected function '$fn' not listed in production."
                exit 1
              }
            fi
          done
